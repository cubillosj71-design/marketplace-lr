# Entorno local y respaldo para la demostración (riesgo R7, ADR-008).
# Uso: docker compose up --build   ->  API en http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://marketplace:marketplace@db:5432/marketplace_db
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  datos_postgres:
